name: Daily News Retention Cleanup

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  retention-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Run four-day retention cleanup
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "ADMIN_API_TOKEN secret is not configured."
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $ADMIN_API_TOKEN" \
            --header "Accept: application/json" \
            https://inforvex-backend.onrender.com/api/retention/cleanup)

          echo "Retention cleanup response:"
          echo "$response"

          echo "$response" | python -c '
          import json, sys
          result = json.load(sys.stdin)
          if result.get("status") != "completed":
              raise SystemExit("Retention cleanup did not complete successfully.")
          print("Retention cleanup completed successfully.")
          '